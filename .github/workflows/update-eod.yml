name: Update EOD Data

on:
  schedule:
    # 12:30 UTC = 6:00 PM IST, Monday–Friday
    # NSE closes at 3:30 PM IST; 6:00 PM gives time for official EOD data to publish
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to fetch (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to commit and push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Python dependencies
        run: pip install requests playwright

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Fetch EOD Daily Snapshot from niftyindices.com
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/fetch-eod.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/fetch-eod.py
          fi

      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-error-screenshot
          path: /tmp/niftyindices_error.png
          if-no-files-found: ignore

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historical.json
          # Only commit if there's an actual diff
          if git diff --cached --quiet; then
            echo "No new data — skipping commit (market holiday or data not yet published)"
          else
            git commit -m "chore: update EOD data $(date -u +%Y-%m-%d)"
            git push
            echo "Pushed updated historical.json — Vercel will redeploy automatically."
          fi
