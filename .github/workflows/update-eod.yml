name: Update EOD Data

on:
  schedule:
    # Retry every 30 min from 6:00 PM to 8:00 PM IST (12:30–14:30 UTC), Mon–Fri
    # Stops doing real work once today's data is already in historical.json
    - cron: "30 12 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "0 14 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to fetch (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to commit and push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip if today's data already present
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if grep -q "\"date\": \"$TODAY\"" data/historical.json 2>/dev/null; then
            echo "already_done=true" >> "$GITHUB_OUTPUT"
            echo "Data for $TODAY already in historical.json — skipping fetch."
          else
            echo "already_done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.11
        if: steps.check.outputs.already_done == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        if: steps.check.outputs.already_done == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Python dependencies
        if: steps.check.outputs.already_done == 'false'
        run: pip install requests playwright

      - name: Install Playwright Chromium
        if: steps.check.outputs.already_done == 'false'
        run: playwright install chromium --with-deps

      - name: Fetch EOD Daily Snapshot from niftyindices.com
        if: steps.check.outputs.already_done == 'false'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/fetch-eod.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/fetch-eod.py
          fi

      - name: Fetch India 10Y bond yield and update byey.json
        if: steps.check.outputs.already_done == 'false'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/fetch-byey.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/fetch-byey.py
          fi

      - name: Upload debug screenshot on failure
        if: failure() && steps.check.outputs.already_done == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-error-screenshot
          path: /tmp/niftyindices_error.png
          if-no-files-found: ignore

      - name: Commit and push if data changed
        if: steps.check.outputs.already_done == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historical.json data/byey.json
          # Only commit if there's an actual diff
          if git diff --cached --quiet; then
            echo "No new data — skipping commit (market holiday or data not yet published)"
          else
            git commit -m "chore: update EOD data $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            echo "Pushed updated historical.json + byey.json — Vercel will redeploy automatically."
          fi
