name: Update EOD Data

on:
  # Primary trigger: cron-job.org calls the workflow_dispatch API at ~6:30 PM and
  # ~8:00 PM IST on weekdays. GitHub's own schedule below is only a backup — it
  # routinely fires 8–11 hours late. fetch-eod.py catches up every missed trading
  # day in the last week, so a late or skipped run is harmless.
  schedule:
    - cron: "30 13 * * 1-5"
    - cron: "30 15 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "EOD date to fetch (YYYY-MM-DD). Leave blank to catch up all recent trading days."
        required: false
        default: ""

# Late GitHub crons bunch up with the cron-job.org dispatches; run one at a time so
# two jobs never race each other on the data commit.
concurrency:
  group: update-eod
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to commit and push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch EOD Daily Snapshot from niftyindices.com
        id: eod
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/fetch-eod.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/fetch-eod.py
          fi

      # The direct CSV almost always works; the browser fallback is installed only
      # when the latest trading day is still missing or incomplete.
      - name: Cache Playwright browsers
        if: steps.eod.outputs.need_playwright == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Retry EOD with Playwright fallback
        if: steps.eod.outputs.need_playwright == 'true'
        run: |
          pip install playwright
          playwright install chromium --with-deps
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/fetch-eod.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/fetch-eod.py
          fi

      - name: Fetch India 10Y bond yield and update byey.json
        run: python scripts/fetch-byey.py

      - name: Sync USD/INR closes into usdinr.json
        run: python scripts/fetch-usdinr.py

      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-error-screenshot
          path: /tmp/niftyindices_error.png
          if-no-files-found: ignore

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historical.json data/byey.json data/usdinr.json
          # Only commit if there's an actual diff
          if git diff --cached --quiet; then
            echo "No new data — skipping commit (market holiday or data not yet published)"
          else
            git commit -m "chore: update EOD data $(TZ=Asia/Kolkata date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            echo "Pushed updated data — Vercel will redeploy automatically."
          fi

      # Runs last so a missing calendar never blocks the data update, but still
      # turns the run red (and emails the repo owner) from 1 January until the new
      # year's NSE holidays are added to data/nse-holidays.json.
      - name: Check NSE holiday calendar covers this year
        run: python scripts/nse_calendar.py
