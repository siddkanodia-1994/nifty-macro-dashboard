name: Refresh Live Prices (manual)

# Live prices are refreshed every minute by cron-job.org calling
# /api/refresh-live-prices. GitHub's 5-minute schedule used to be the fallback,
# but GitHub only ran it once or twice a day, always after market close, so it is
# now manual-only. Staleness is caught by cron-job.org monitoring /api/health.
#
# Needs repository secret CRON_SECRET (same value as the Vercel env var).

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/refresh-live-prices
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" \
            https://nifty-macro-dashboard.vercel.app/api/refresh-live-prices
